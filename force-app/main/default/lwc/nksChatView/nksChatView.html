<template>
    <div class="container">
        <p class="aksel-body-long aksel-body-long--medium">Chatsamtale</p>
        <h1 class="aksel-heading aksel-heading--xlarge header">{themeGroup}</h1>
        <p class="aksel-body-long aksel-body-long--medium modal-text">
            Trykk her for å se
            <button onclick={handleModalButton} class="aksel-link aksel-link--action frida-button">
                samtale med NavBot
            </button>
        </p>
        <c-ds-modal show-close-button show-modal={modalOpen} onmodalclosed={closeModal} modal-header="Chatbot samtale">
            <div slot="modalContent">
                <div lwc:if={isChatTranscript}>
                    <lightning-formatted-rich-text value={chatbotMessage}></lightning-formatted-rich-text>
                </div>
                <div lwc:else class="aksel-body-long aksel-body-long--medium chatbot-text">{chatbotMessage}</div>
            </div>
        </c-ds-modal>
        <c-community-message-container message-groups={messageGroups}></c-community-message-container>
    </div>
</template>
